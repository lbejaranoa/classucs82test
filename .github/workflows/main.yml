name:CI

on: 
  push:
    branches:[ "main" ]
  pull_request:
    branches:[ "main" ]
  workflow_dispatch: 

jobs: 
  build: 
    runs-on:ubuntu-lastest

    steps: 
      - name: Clonar repositorio
        uses: actions/checkout@v3
      
      - name: Instalar python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.11"
      
      - name: Instalar dependencias
        run: pip install pytest
      
      - name: Ejecutar pruebas
        run: pytest
